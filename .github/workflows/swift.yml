name: CI

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project ChallengeFinal.xcodeproj \
            -scheme ChallengeFinal \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project ChallengeFinal.xcodeproj \
            -scheme ChallengeFinal \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO
