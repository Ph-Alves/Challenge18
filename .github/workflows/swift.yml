name: Challenge Final

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build & Test
        run: |
          xcodebuild test \
            -project ChallengeFinal.xcodeproj \
            -scheme ChallengeFinal \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -skip-testing:ChallengeFinalUITests \
            CODE_SIGNING_ALLOWED=NO \
            SDKROOT=iphonesimulator
