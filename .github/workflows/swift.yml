name: Challenge Final

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install iOS Simulator Runtime
        run: |
          set -euo pipefail
          xcodebuild -downloadPlatform iOS
          echo "--- runtimes ---"
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; rts=[r['identifier'] for r in json.load(sys.stdin)['runtimes'] if 'iOS' in r.get('name','')]; print(rts[-1] if rts else '')")
          echo "Runtime selecionado: $RUNTIME"
          [ -n "$RUNTIME" ] || { echo "ERRO: nenhum runtime iOS encontrado"; exit 1; }
          xcrun simctl create "CI-iPhone" "iPhone 16" "$RUNTIME"
          echo "--- devices ---"
          xcrun simctl list devices | grep -A10 "iOS"

      - name: Build & Test
        run: |
          xcodebuild test \
            -project ChallengeFinal.xcodeproj \
            -scheme ChallengeFinal \
            -destination 'platform=iOS Simulator,name=CI-iPhone' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 2 \
            -jobs $(sysctl -n hw.logicalcpu) \
            CODE_SIGNING_ALLOWED=NO \
            SDKROOT=iphonesimulator
